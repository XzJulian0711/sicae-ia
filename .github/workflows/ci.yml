# Integracion continua (CI): GitHub corre las pruebas en cada push,
# para que nadie suba codigo roto al repo.
#
# Todavia NO es un workflow funcional: solo describe los pasos previstos.
#
# Que ira aqui:
#
# name: CI
#
# on: push y pull_request sobre la rama main
#
# jobs:
#   pruebas:
#     - Descargar el codigo del repo              (actions/checkout)
#     - Instalar Python 3.13                      (actions/setup-python)
#     - Instalar api/requirements.txt (incluye ml/requirements.txt)
#     - Instalar el proyecto: pip install -e .   (paquete sicae_ml, ver pyproject.toml)
#     - Correr pytest desde la raíz (ml/tests/ y api/tests/, ver pyproject.toml)
#
# Nota: el CI no entrena el modelo ni descarga los datasets.
# ml/data/raw/ y ml/models/ estan fuera de Git, asi que las pruebas
# deben funcionar sin ellos (con datos de ejemplo pequenos).
