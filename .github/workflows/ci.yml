# Integración continua (CI): GitHub corre las pruebas en cada push y en cada pull request,
# para que nadie suba código roto, y revisa si alguna dependencia tiene vulnerabilidades.
#
# El job no entrena el modelo ni descarga datos: ml/data/, ml/models/*.joblib y los .eml
# están fuera de Git. Las pruebas usan datos y modelos inventados; la única que necesita el
# modelo real (.joblib) se salta sola y pytest lo informa al final (-rs).

name: CI

on:
  push:
    branches: ["**"]  # cualquier rama
  pull_request:
    branches: [main]  # pull requests hacia main

# Permisos mínimos: el job solo lee el código del repositorio.
permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas y auditoría de dependencias
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Instalar Python 3.13 (con caché de pip)
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # La caché se renueva cuando cambia alguno de estos archivos.
          cache-dependency-path: |
            ml/requirements.txt
            api/requirements.txt

      - name: Instalar dependencias y el paquete sicae_ml
        run: |
          python -m pip install --upgrade pip
          pip install -r api/requirements.txt
          pip install -e .

      - name: Pruebas (pytest)
        # -W error::DeprecationWarning: un aviso de obsolescencia cuenta como error.
        # -rs: al final lista las pruebas saltadas y el motivo.
        run: pytest -W error::DeprecationWarning -rs

      - name: Auditoría de dependencias (pip-audit)
        # Corre aunque fallen las pruebas, para ver los dos resultados. Si encuentra una
        # vulnerabilidad conocida, imprime el paquete, la versión y el identificador, y el job falla.
        if: ${{ !cancelled() }}
        run: |
          pip install pip-audit==2.9.0
          pip-audit -r api/requirements.txt --desc on
